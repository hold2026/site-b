<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Convertisseur de Devises - Hold2026</title><style>body{font-family:Arial,sans-serif;max-width:600px;margin:50px auto;padding:20px;background:#f5f5f5}h1{color:#333}.container{background:white;padding:20px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}input,select{width:100%;padding:10px;margin:10px 0;border:1px solid #ddd;border-radius:4px;box-sizing:border-box}button{width:100%;padding:12px;background:#007bff;color:white;border:none;border-radius:4px;cursor:pointer;font-size:16px;margin-top:10px}button:hover{background:#0056b3}#result{margin-top:20px;padding:15px;background:#e7f3ff;border-left:4px solid #007bff;border-radius:4px;display:none}.error{color:#d32f2f;font-weight:bold}</style></head><body><div class="container"><h1>Convertisseur de Devises</h1><p><em>Contenu IA généré — Données en temps réel via exchangerate.host</em></p><input type="number" id="montant" placeholder="Montant" value="100" min="0.01" step="0.01"><select id="deDevise"><option value="EUR">EUR (Euro)</option><option value="USD">USD (Dollar US)</option><option value="GBP">GBP (Livre sterling)</option><option value="JPY">JPY (Yen)</option><option value="CHF">CHF (Franc suisse)</option><option value="CAD">CAD (Dollar canadien)</option><option value="AUD">AUD (Dollar australien)</option><option value="CNY">CNY (Yuan)</option></select><select id="versDevise"><option value="USD">USD (Dollar US)</option><option value="EUR">EUR (Euro)</option><option value="GBP">GBP (Livre sterling)</option><option value="JPY">JPY (Yen)</option><option value="CHF">CHF (Franc suisse)</option><option value="CAD">CAD (Dollar canadien)</option><option value="AUD">AUD (Dollar australien)</option><option value="CNY">CNY (Yuan)</option></select><button onclick="convertir()">Convertir</button><div id="result"></div></div><script>async function convertir(){const montant=document.getElementById('montant').value;const deDevise=document.getElementById('deDevise').value;const versDevise=document.getElementById('versDevise').value;const resultat=document.getElementById('result');resultat.style.display='none';if(!montant||montant<=0){resultat.innerHTML='<span class="error">Veuillez entrer un montant valide</span>';resultat.style.display='block';return}try{const response=await fetch(`https://api.exchangerate.host/convert?from=${deDevise}&to=${versDevise}&amount=${montant}`);const data=await response.json();if(data.success){const taux=data.info.rate;const montantConverti=data.result;resultat.innerHTML=`<strong>${montant} ${deDevise} = ${montantConverti.toFixed(2)} ${versDevise}</strong><br/>Taux: 1 ${deDevise} = ${taux.toFixed(4)} ${versDevise}<br/><small>Mis à jour le ${new Date().toLocaleString('fr-FR')}</small>`;resultat.style.display='block'}else{resultat.innerHTML='<span class="error">Erreur API: '+data.error.info+'</span>';resultat.style.display='block'}}catch(e){resultat.innerHTML='<span class="error">Erreur réseau: '+e.message+'</span>';resultat.style.display='block'}}</script><script data-goatcounter="https://hold2026.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></body></html>
