<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convertisseur de devises 2026 - Taux en temps réel</title>
  <meta name="description" content="Convertisseur de devises gratuit avec taux de change en temps réel. Convertissez EUR, USD, GBP, JPY et plus.">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f5f5f5; }
    .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { color: #333; margin-top: 0; }
    .form-group { margin: 20px 0; }
    label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
    button { background: #007bff; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 20px; width: 100%; }
    button:hover { background: #0056b3; }
    .result { margin-top: 30px; padding: 20px; background: #e8f4f8; border-left: 4px solid #007bff; border-radius: 4px; display: none; }
    .result h2 { margin: 0 0 10px 0; color: #007bff; }
    .result p { margin: 5px 0; color: #333; }
    .error { color: #d32f2f; margin-top: 10px; }
    .footer { margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; font-size: 12px; color: #999; }
  </style>
</head>
<body>
  <div class="container">
    <h1>💱 Convertisseur de devises</h1>
    <p>Taux de change actualisés via une API publique gratuite.</p>
    
    <div class="form-group">
      <label for="amount">Montant :</label>
      <input type="number" id="amount" placeholder="100" value="100" step="0.01">
    </div>
    
    <div class="form-group">
      <label for="from">De :</label>
      <select id="from">
        <option value="EUR">EUR (€)</option>
        <option value="USD">USD ($)</option>
        <option value="GBP">GBP (£)</option>
        <option value="JPY">JPY (¥)</option>
        <option value="CHF">CHF (CHF)</option>
        <option value="CAD">CAD ($)</option>
        <option value="AUD">AUD ($)</option>
      </select>
    </div>
    
    <div class="form-group">
      <label for="to">Vers :</label>
      <select id="to">
        <option value="USD">USD ($)</option>
        <option value="EUR">EUR (€)</option>
        <option value="GBP">GBP (£)</option>
        <option value="JPY">JPY (¥)</option>
        <option value="CHF">CHF (CHF)</option>
        <option value="CAD">CAD ($)</option>
        <option value="AUD">AUD ($)</option>
      </select>
    </div>
    
    <button onclick="convertir()">Convertir</button>
    
    <div id="result" class="result">
      <h2>Résultat</h2>
      <p id="result-text"></p>
      <p style="font-size: 12px; color: #666; margin-top: 10px;" id="result-rate"></p>
    </div>
    
    <div id="error" class="error"></div>
    
    <div class="footer">
      <p><strong>⚠️ Contenu généré avec assistance IA</strong> · Données de taux via exchangerate-api.com (API publique gratuite)</p>
      <p>Mise à jour quotidienne · Aucune garantie de précision financière · À titre informatif uniquement</p>
    </div>
  </div>
  
  <script>
    async function convertir() {
      const amount = parseFloat(document.getElementById('amount').value);
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      const errorDiv = document.getElementById('error');
      const resultDiv = document.getElementById('result');
      
      errorDiv.innerHTML = '';
      
      if (isNaN(amount) || amount <= 0) {
        errorDiv.innerHTML = 'Veuillez entrer un montant valide';
        return;
      }
      
      try {
        const response = await fetch('https://api.exchangerate-api.com/v4/latest/' + from);
        if (!response.ok) throw new Error('Erreur API');
        const data = await response.json();
        const rate = data.rates[to];
        const result = (amount * rate).toFixed(2);
        document.getElementById('result-text').innerHTML = `<strong>${amount} ${from} = ${result} ${to}</strong>`;
        document.getElementById('result-rate').innerHTML = `Taux actuel : 1 ${from} = ${rate.toFixed(4)} ${to}`;
        resultDiv.style.display = 'block';
      } catch (e) {
        errorDiv.innerHTML = 'Erreur lors de la conversion. Vérifiez votre connexion.';
      }
    }
  </script>
  
  <script data-goatcounter="https://hold2026.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
